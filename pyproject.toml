[project]
name = "gaussianmot"
version = "1.0"
description = "GaussianMOT: Gaussian Splatting for Camera-Radar 3D Detection and Tracking"
authors = [
    { name = "Santiago Montiel-Marin" }
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "addict>=2.4.0",
    "diff-gaussian-rasterization>=1.0",
    "efficientnet-pytorch>=0.7.1",
    "einops>=0.8.1",
    "fvcore>=0.1.5.post20221221",
    "gradio>=5.44.1",
    "hydra-core>=1.3.2",
    "imgaug>=0.4.0",
    "jaxtyping>=0.3.2",
    "lightning>=2.5.0",
    "matplotlib>=3.10.6",
    "moviepy>=2.2.1",
    "numpy<2.0.0",
    "nuscenes-devkit>=1.2.0",
    "peft>=0.18.0",
    "pillow>=11.3.0",
    "rootutils>=1.0.7",
    "segmentation-models-pytorch>=0.5.0",
    "setuptools>=77",
    "timm>=1.0.21",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "transformers>=4.56.0",
    "wandb>=0.21.3",
]

[build-system]
requires = ["setuptools >= 77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["gaussianmot"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu118" },
]
torchvision = [
  { index = "pytorch-cu118" },
]
diff_gaussian_rasterization = [
  { path = "./gaussianmot/ops/diff-gaussian-rasterization" },
]


[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]

[tool.uv]
find-links = [
  "https://data.pyg.org/whl/torch-2.5.1+cu118.html"
]